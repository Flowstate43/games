<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>HOOD CHASE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #07080c;
      --green: #00e676;
      --gold: #ffd54f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: "Space Grotesk", sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    header {
      width: min(480px, 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: "Press Start 2P", monospace;
      font-size: 10px;
      color: var(--green);
    }
    header .title { color: #fff; letter-spacing: 2px; }
    canvas {
      background:
        radial-gradient(ellipse at 50% 120%, #0d1f14 0%, #07080c 55%),
        repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(0,230,118,0.04) 24px);
      border: 2px solid #1b3d28;
      border-radius: 12px;
      max-width: 100%;
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0,230,118,0.12);
    }
    #hud {
      width: min(480px, 100%);
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
      color: #9ae6b4;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.78);
      z-index: 5;
    }
    #overlay.hidden { display: none; }
    .panel {
      width: min(400px, 92vw);
      max-height: 92vh;
      overflow: auto;
      background: #0b120e;
      border: 2px solid var(--green);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
    }
    .panel h1 {
      font-family: "Press Start 2P", monospace;
      font-size: 16px;
      color: var(--green);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .panel p { color: #b8c4bc; margin-bottom: 14px; font-size: 15px; line-height: 1.45; }
    button {
      font-family: "Press Start 2P", monospace;
      font-size: 11px;
      background: var(--green);
      color: #041108;
      border: none;
      padding: 14px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin: 4px;
    }
    button.ghost {
      background: transparent;
      color: var(--green);
      border: 1px solid var(--green);
    }
    button:active { transform: translateY(2px); }
    .tokens { font-size: 22px; letter-spacing: 8px; margin: 8px 0 14px; }
    a.back {
      position: fixed;
      top: 10px;
      left: 12px;
      color: #6b7c70;
      text-decoration: none;
      font-size: 13px;
      z-index: 6;
    }
    .scores {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 16px;
      font-family: "Press Start 2P", monospace;
      font-size: 9px;
    }
    .scores th, .scores td {
      padding: 7px 4px;
      text-align: left;
      color: #c8e6c9;
    }
    .scores th { color: var(--gold); border-bottom: 1px solid #1b3d28; }
    .scores tr.me td { color: var(--green); }
    .scores td.rank { color: #6b7c70; width: 28px; }
    .name-row { display: flex; gap: 8px; justify-content: center; margin: 10px 0 14px; }
    .name-row input {
      width: 90px;
      text-align: center;
      text-transform: uppercase;
      font-family: "Press Start 2P", monospace;
      font-size: 14px;
      padding: 10px 8px;
      background: #041108;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 8px;
    }
    #muteBtn {
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 6;
      font-size: 9px;
      padding: 8px 10px;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Games</a>
  <button id="muteBtn" class="ghost" type="button">SFX ON</button>
  <div id="wrap">
    <header>
      <span class="title">HOOD CHASE</span>
      <span id="wave">WAVE 1</span>
    </header>
    <canvas id="game" width="480" height="640"></canvas>
    <div id="hud">
      <span id="score">SCORE 0</span>
      <span id="hi">HI 0</span>
      <span id="lives">LIVES ***</span>
    </div>
  </div>

  <div id="overlay"></div>

<script>
(() => {
  const HS_KEY = "hoodchase_scores_v1";
  const MUTE_KEY = "hoodchase_mute";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const overlay = document.getElementById("overlay");

  const TYPES = [
    { id: "feather", label: "🪶", color: "#00e676", pts: 10 },
    { id: "btc",     label: "₿",  color: "#f7931a", pts: 20 },
    { id: "eth",     label: "Ξ",  color: "#8ea2ff", pts: 30 },
    { id: "pepe",    label: "🐸", color: "#66bb6a", pts: 50 },
  ];

  let state = "menu";
  let score = 0, lives = 3, wave = 1;
  let player = null;
  let bullets = [];
  let enemies = [];
  let bombs = [];
  let particles = [];
  let keys = {};
  let cooldown = 0, dir = 1, dropTimer = 0, lastTs = 0;
  let muted = localStorage.getItem(MUTE_KEY) === "1";
  let audioCtx = null;

  function loadScores() {
    try { return JSON.parse(localStorage.getItem(HS_KEY) || "[]"); }
    catch { return []; }
  }
  function saveScores(list) {
    localStorage.setItem(HS_KEY, JSON.stringify(list.slice(0, 10)));
  }
  function bestScore() {
    const s = loadScores();
    return s.length ? s[0].score : 0;
  }
  function addScore(name, sc, wv) {
    const clean = (name || "HOO").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 3) || "HOO";
    const list = loadScores();
    list.push({ name: clean, score: sc, wave: wv, at: Date.now() });
    list.sort((a, b) => b.score - a.score || b.wave - a.wave);
    saveScores(list);
    return list;
  }
  function scoresTable(highlight) {
    const list = loadScores();
    if (!list.length) return `<p style="font-size:13px;color:#6b7c70">No scores yet. First bag on the board wins.</p>`;
    const rows = list.map((r, i) => {
      const me = highlight && r.score === highlight.score && r.name === highlight.name && r.at === highlight.at;
      return `<tr class="${me ? "me" : ""}"><td class="rank">${i + 1}</td><td>${r.name}</td><td>${r.score}</td><td>W${r.wave}</td></tr>`;
    }).join("");
    return `<table class="scores"><thead><tr><th></th><th>TAG</th><th>SCORE</th><th>WAVE</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function ensureAudio() {
    if (muted) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type, vol, slide) {
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime;
    const osc = ac.createOscillator();
    const g = ac.createGain();
    osc.type = type || "square";
    osc.frequency.setValueAtTime(freq, t0);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t0 + dur);
    g.gain.setValueAtTime(vol || 0.08, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(ac.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol) {
    const ac = ensureAudio();
    if (!ac) return;
    const n = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = ac.createBufferSource();
    const g = ac.createGain();
    const f = ac.createBiquadFilter();
    f.type = "lowpass"; f.frequency.value = 900;
    src.buffer = n;
    g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start();
  }
  const sfx = {
    shoot() { beep(720, 0.07, "square", 0.05, 280); },
    hit() { beep(220, 0.12, "sawtooth", 0.07, 80); noise(0.08, 0.08); },
    boom() { beep(140, 0.28, "sawtooth", 0.1, 50); noise(0.22, 0.16); },
    wave() { beep(440, 0.1, "square", 0.06); setTimeout(() => beep(660, 0.12, "square", 0.06), 90); },
    over() { beep(320, 0.18, "square", 0.08, 160); setTimeout(() => beep(180, 0.35, "sawtooth", 0.08, 70), 160); },
    start() { beep(330, 0.08, "square", 0.06); setTimeout(() => beep(494, 0.1, "square", 0.06), 80); },
  };

  function renderMenu(extra) {
    overlay.classList.remove("hidden");
    overlay.innerHTML = `
      <div class="panel">
        <h1>HOOD CHASE</h1>
        <div class="tokens">🪶 ₿ Ξ 🐸</div>
        <p>Space Invaders, but the swarm is Robinhood feathers and token logos. Shoot the bag.</p>
        <p style="font-size:12px;color:#7d8a80">A/D or arrows · SPACE / tap to fire</p>
        ${scoresTable()}
        ${extra || ""}
        <button id="startBtn" type="button">START HEIST</button>
      </div>`;
  }
  function renderOver() {
    const qualifies = score > 0 && (loadScores().length < 10 || score > (loadScores()[loadScores().length - 1]?.score || 0));
    overlay.classList.remove("hidden");
    overlay.innerHTML = `
      <div class="panel">
        <h1>BAG DROPPED</h1>
        <p>Score ${score} · Wave ${wave}</p>
        ${qualifies ? `
          <p style="font-size:12px;color:#ffd54f">NEW BOARD ENTRY</p>
          <div class="name-row">
            <input id="tagIn" maxlength="3" value="HOO" />
            <button id="saveBtn" type="button">SAVE</button>
          </div>` : scoresTable()}
        ${qualifies ? "" : ""}
        <button id="startBtn" type="button">RUN IT BACK</button>
        <button id="boardBtn" class="ghost" type="button">BOARD</button>
      </div>`;
  }

  function reset() {
    score = 0; lives = 3; wave = 1;
    keys = {}; bullets = []; bombs = []; particles = [];
    cooldown = 0; dir = 1; dropTimer = 0;
    player = { x: W / 2, y: H - 52, w: 36, h: 22, speed: 260 };
    spawnWave();
    hud();
  }
  function spawnWave() {
    enemies = [];
    const rows = Math.min(5, 3 + Math.floor(wave / 2));
    const cols = 8;
    const gapX = 48, gapY = 42;
    const startX = (W - (cols - 1) * gapX) / 2;
    const startY = 50;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const t = TYPES[(r + wave + c) % TYPES.length];
        enemies.push({ x: startX + c * gapX, y: startY + r * gapY, w: 28, h: 28, type: t, alive: true });
      }
    }
    dir = 1;
  }
  function fire() {
    if (cooldown > 0 || state !== "play") return;
    bullets.push({ x: player.x, y: player.y - 16, vy: -420 });
    cooldown = 0.22;
    sfx.shoot();
  }
  function explode(x, y, color, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 140;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.35, max: 0.7, color });
    }
  }
  function hud() {
    document.getElementById("score").textContent = "SCORE " + score;
    document.getElementById("hi").textContent = "HI " + Math.max(bestScore(), score);
    document.getElementById("lives").textContent = "LIVES " + "*".repeat(Math.max(0, lives));
    document.getElementById("wave").textContent = "WAVE " + wave;
    document.getElementById("muteBtn").textContent = muted ? "SFX OFF" : "SFX ON";
  }

  function update(dt) {
    if (state !== "play") return;
    cooldown = Math.max(0, cooldown - dt);
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) player.x -= player.speed * dt;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) player.x += player.speed * dt;
    player.x = Math.max(22, Math.min(W - 22, player.x));

    bullets.forEach(b => b.y += b.vy * dt);
    bullets = bullets.filter(b => b.y > -20);

    const alive = enemies.filter(e => e.alive);
    if (!alive.length) {
      wave++;
      sfx.wave();
      spawnWave();
      hud();
      return;
    }

    let hitEdge = false;
    const speed = 28 + wave * 10;
    alive.forEach(e => {
      e.x += dir * speed * dt;
      if (e.x < 18 || e.x > W - 18) hitEdge = true;
    });
    if (hitEdge) {
      dir *= -1;
      alive.forEach(e => { e.y += 16; e.x += dir * 8; });
    }

    dropTimer -= dt;
    if (dropTimer <= 0 && alive.length) {
      dropTimer = Math.max(0.35, 1.15 - wave * 0.08);
      const shooter = alive[Math.floor(Math.random() * alive.length)];
      bombs.push({ x: shooter.x, y: shooter.y + 14, vy: 160 + wave * 18, color: shooter.type.color });
    }
    bombs.forEach(b => b.y += b.vy * dt);
    bombs = bombs.filter(b => b.y < H + 20);

    bullets.forEach(b => {
      enemies.forEach(e => {
        if (!e.alive) return;
        if (Math.abs(b.x - e.x) < e.w / 2 && Math.abs(b.y - e.y) < e.h / 2) {
          e.alive = false;
          b.y = -999;
          score += e.type.pts * wave;
          explode(e.x, e.y, e.type.color);
          sfx.hit();
          hud();
        }
      });
    });

    bombs.forEach(b => {
      if (Math.abs(b.x - player.x) < 18 && Math.abs(b.y - player.y) < 16) {
        b.y = H + 99;
        lives--;
        explode(player.x, player.y, "#00e676", 16);
        sfx.boom();
        hud();
        if (lives <= 0) gameOver();
      }
    });

    if (alive.some(e => e.y > player.y - 28)) {
      lives = 0;
      gameOver();
    }

    particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    particles = particles.filter(p => p.life > 0);
  }

  function drawShip(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#0b3d22";
    ctx.beginPath();
    ctx.moveTo(-18, 8); ctx.lineTo(0, -16); ctx.lineTo(18, 8); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#00e676";
    ctx.beginPath();
    ctx.moveTo(-12, 6); ctx.lineTo(0, -10); ctx.lineTo(12, 6); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffd54f";
    ctx.beginPath();
    ctx.ellipse(10, -14, 4, 10, 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    for (let i = 0; i < 40; i++) {
      const sx = (i * 97) % W;
      const sy = (i * 53 + Date.now() * 0.01) % H;
      ctx.fillRect(sx, sy, 1, 1);
    }
    (enemies || []).forEach(e => {
      if (!e.alive) return;
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath(); ctx.arc(0, 2, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = e.type.color;
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#041108";
      ctx.font = "16px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(e.type.label, 0, 1);
      ctx.restore();
    });
    bullets.forEach(b => { ctx.fillStyle = "#ffd54f"; ctx.fillRect(b.x - 1.5, b.y, 3, 12); });
    bombs.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x - 2, b.y, 4, 10); });
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 3, 3);
      ctx.globalAlpha = 1;
    });
    if (player) drawShip(player.x, player.y);
  }

  function loop(ts) {
    const dt = Math.min(0.033, (ts - (lastTs || ts)) / 1000);
    lastTs = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    ensureAudio();
    overlay.classList.add("hidden");
    reset();
    state = "play";
    sfx.start();
    hud();
  }
  function gameOver() {
    if (state !== "play") return;
    state = "over";
    sfx.over();
    hud();
    renderOver();
  }

  overlay.addEventListener("click", (e) => {
    const id = e.target && e.target.id;
    if (id === "startBtn") startGame();
    if (id === "boardBtn") renderMenu();
    if (id === "saveBtn") {
      const tag = (document.getElementById("tagIn") || {}).value || "HOO";
      const list = addScore(tag, score, wave);
      const last = list.find(r => r.score === score && r.wave === wave);
      overlay.innerHTML = `
        <div class="panel">
          <h1>LOCKED IN</h1>
          ${scoresTable(last)}
          <button id="startBtn" type="button">RUN IT BACK</button>
        </div>`;
      hud();
    }
  });

  document.getElementById("muteBtn").onclick = () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
    if (!muted) ensureAudio();
    hud();
  };

  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === " " || e.code === "Space") { e.preventDefault(); fire(); }
    if ((e.key === "Enter" || e.key === "s" || e.key === "S") && state !== "play") {
      if (document.getElementById("startBtn")) startGame();
    }
  });
  window.addEventListener("keyup", e => { keys[e.key] = false; });

  let dragging = false;
  canvas.addEventListener("pointerdown", e => {
    dragging = true;
    const r = canvas.getBoundingClientRect();
    if (player) player.x = (e.clientX - r.left) * (W / r.width);
    fire();
  });
  canvas.addEventListener("pointermove", e => {
    if (!dragging || !player) return;
    const r = canvas.getBoundingClientRect();
    player.x = Math.max(22, Math.min(W - 22, (e.clientX - r.left) * (W / r.width)));
  });
  window.addEventListener("pointerup", () => { dragging = false; });

  hud();
  renderMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
